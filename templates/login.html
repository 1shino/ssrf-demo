{% extends "base.html" %}

{% block title %}访问验证{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-icon">🔐</div>
        <h1>访问验证</h1>
        <p>请输入访问密码以继续</p>

        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="input-group">
                <input type="password" name="password" placeholder="请输入密码" autofocus required>
            </div>
            <button type="submit" class="btn btn-danger">进入系统</button>
        </form>
    </div>
</div>

<style>
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 60vh;
    }

    .login-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 3rem;
        text-align: center;
        max-width: 400px;
        width: 100%;
    }

    .login-icon {
        font-size: 4rem;
        margin-bottom: 1rem;
    }

    .login-card h1 {
        color: #f5f5f7;
        font-size: 1.75rem;
        margin-bottom: 0.5rem;
    }

    .login-card p {
        color: #a1a1a6;
        margin-bottom: 2rem;
    }

    .input-group {
        margin-bottom: 1.5rem;
    }

    .input-group input {
        width: 100%;
        padding: 0.875rem 1.25rem;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        color: #f5f5f7;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s;
        box-sizing: border-box;
    }

    .input-group input:focus {
        border-color: #007aff;
    }

    .input-group input::placeholder {
        color: #6e6e73;
    }

    .login-card .btn {
        width: 100%;
        padding: 0.875rem;
        font-size: 1rem;
    }

    .login-error {
        background: rgba(255, 59, 48, 0.15);
        border: 1px solid rgba(255, 59, 48, 0.3);
        border-radius: 10px;
        padding: 0.75rem 1rem;
        color: #ff3b30;
        margin-bottom: 1.5rem;
        font-size: 0.875rem;
    }
</style>
{% endblock %}
